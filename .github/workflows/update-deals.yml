name: Update Deals Data

on:
  schedule:
    # Every three hours, offset from the busiest scheduler boundary.
    - cron: '17 */3 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  fetch-deals:
    runs-on: ubuntu-latest
    # The schedule fires every three hours; never let a stalled run outlive its
    # own interval and collide with the next one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Manual validation runs execute on a feature branch and rebase their
          # generated-data commit onto main before pushing. A depth-1 checkout
          # omits the merge base and turns every shared file into add/add.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch deals from CheapShark
        env:
          MAX_PRICE: 70
          PAGE_SIZE: 60
          # Guaranteed floor per store; productive stores may page deeper.
          PAGES_PER_STORE: 2
          # One global Recent pass replaces 2 pages x 14 stores. Those eight
          # pages retain new-arrival coverage with twenty fewer duplicate-prone
          # calls, leaving more of the same budget for ranked price coverage.
          GLOBAL_RECENT_PAGES: 8
          # Candidate depth, not a per-store entitlement. Sparse stores stop
          # early and productive stores compete for the global budget below.
          MAX_PAGES_PER_STORE: 5
          MIN_PAGE_YIELD: 0.25
          # Enforce request starts at 40/minute. The old 350ms loop sleeps still
          # packed about 60 calls into 47 seconds because response time varied;
          # retries also bypassed those sleeps entirely.
          REQUEST_INTERVAL_MS: 1500
          # Hard ceiling including /stores. This matches the request volume
          # CheapShark previously confirmed was acceptable for this schedule.
          MAX_REQUESTS: 70
        run: node scripts/fetch-deals.js

      - name: Enrich catalog with Steam metadata (no key)
        env:
          MAX_NEW_STEAM_LOOKUPS: 60
        run: node scripts/enrich-catalog-steam.js

      - name: Build quality-qualified alert snapshot
        run: node scripts/build-alert-snapshot.js

      - name: Build permanent game price pages
        run: node scripts/build-game-pages.js

      - name: Refresh guide evidence modules
        run: node scripts/build-guide-deal-modules.js

      - name: Build search landing pages
        run: node scripts/build-search-pages.js

      - name: Bake the homepage no-JavaScript fallback
        run: node scripts/build-home-fallback.js

      - name: Generate RSS feed
        run: node scripts/generate-rss.js

      - name: Generate canonical sitemap
        run: node scripts/generate-sitemap.js

      - name: Build large umbrella games catalog (no key)
        env:
          MAX_GAMES: 5000
          MAX_PAGES: 8
        run: node scripts/build-games-catalog-large.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          [ -f enriched-deals.json ] && git add enriched-deals.json || true
          [ -f alert-deals.json ] && git add alert-deals.json || true
          [ -f games-catalog.json ] && git add games-catalog.json || true
          [ -f games-catalog-large.json ] && git add games-catalog-large.json || true
          [ -d deals ] && git add deals || true
          [ -d games ] && git add games || true
          git add index.html
          # Without this the archive resets every run, every page reverts to
          # deal-only, and expired games start 404ing again.
          [ -f game-pages-archive.json ] && git add game-pages-archive.json || true
          [ -f feed.xml ] && git add feed.xml || true
          [ -f sitemap.xml ] && git add sitemap.xml || true
          git add blog/game-price-comparison.html
          git add blog/best-free-pc-games.html
          git add blog/steam-sale-guide.html
          git add blog/are-90-percent-discounts-good.html

          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git commit -m "Update deals + enriched + umbrella catalog [skip ci]"

          git pull --rebase origin main || {
            git rebase --abort || true
            echo "Rebase conflict on generated files; the refresh was not published"
            exit 1
          }

          git push || {
            echo "Push failed; the refresh was not published"
            exit 1
          }

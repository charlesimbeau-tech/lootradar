name: Update Deals Data

on:
  schedule:
    # Every three hours, offset from the busiest scheduler boundary.
    - cron: '17 */3 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  fetch-deals:
    runs-on: ubuntu-latest
    # The schedule fires every three hours; never let a stalled run outlive its
    # own interval and collide with the next one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch deals from CheapShark
        env:
          MAX_PRICE: 70
          PAGE_SIZE: 60
          # Guaranteed floor per store; adaptive paging may go deeper. Lowered
          # from 3 to 2 on 2026-08-01 so the ceiling could come back down to 3
          # without pinning floor to ceiling and disabling the yield gate again.
          PAGES_PER_STORE: 2
          # Second pass per store that keeps recent releases in the snapshot.
          # Set to 0 to disable without touching the fetch script.
          RECENT_PAGES_PER_STORE: 2
          # Raising this to 10 tripped CheapShark's rate limiter on 2026-07-30:
          # Steam, GamersGate and GOG each pulled 10 pages and the runner was
          # blocked for an hour around request 50, failing 8 of 14 stores. It
          # was pinned to 3 in response, which also pinned it to the floor above
          # and so disabled adaptive paging entirely: the yield gate in
          # fetch-deals.js only fires past PAGES_PER_STORE, which it could never
          # reach.
          #
          # Briefly 4 on 2026-07-31, on the reasoning that one more page per
          # store was at most 14 extra requests and the runs were only using 65
          # of the 90 budget. That reasoning was wrong, and the evidence was
          # immediate: the very next scheduled run failed with HTTP 429 and a
          # one-hour Retry-After, and four of the following eight scheduled runs
          # failed the same way. Staying under our own budget says nothing,
          # because the limiter is CheapShark's and it responds to request rate
          # and volume, not to a counter we keep.
          #
          # Back to 3, with the floor at 2 so the yield gate still has room to
          # work. Worst case is 14 x (3 + 2) = 70, matching the shape CheapShark
          # confirmed by email on 2026-07-31 as fine across eight daily runs.
          #
          # Before raising this again: lengthen the sleep in fetch-deals.js
          # first, change one variable at a time, and watch several consecutive
          # scheduled runs rather than a single manual one. They also asked to be
          # contacted rather than guessed at, which is cheaper than this was.
          MAX_PAGES_PER_STORE: 3
          MIN_PAGE_YIELD: 0.25
          # Hard ceiling. Keep comfortably above the expected per-run usage so a
          # store returning unusually deep results cannot run away with it.
          MAX_REQUESTS: 90
        run: node scripts/fetch-deals.js

      - name: Enrich catalog with Steam metadata (no key)
        env:
          MAX_NEW_STEAM_LOOKUPS: 60
        run: node scripts/enrich-catalog-steam.js

      - name: Build quality-qualified alert snapshot
        run: node scripts/build-alert-snapshot.js

      - name: Build permanent game price pages
        run: node scripts/build-game-pages.js

      - name: Refresh guide evidence modules
        run: node scripts/build-guide-deal-modules.js

      - name: Build search landing pages
        run: node scripts/build-search-pages.js

      - name: Bake the homepage no-JavaScript fallback
        run: node scripts/build-home-fallback.js

      - name: Generate RSS feed
        run: node scripts/generate-rss.js

      - name: Generate canonical sitemap
        run: node scripts/generate-sitemap.js

      - name: Build large umbrella games catalog (no key)
        env:
          MAX_GAMES: 5000
          MAX_PAGES: 8
        run: node scripts/build-games-catalog-large.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          [ -f enriched-deals.json ] && git add enriched-deals.json || true
          [ -f alert-deals.json ] && git add alert-deals.json || true
          [ -f games-catalog.json ] && git add games-catalog.json || true
          [ -f games-catalog-large.json ] && git add games-catalog-large.json || true
          [ -d deals ] && git add deals || true
          [ -d games ] && git add games || true
          git add index.html
          # Without this the archive resets every run, every page reverts to
          # deal-only, and expired games start 404ing again.
          [ -f game-pages-archive.json ] && git add game-pages-archive.json || true
          [ -f feed.xml ] && git add feed.xml || true
          [ -f sitemap.xml ] && git add sitemap.xml || true
          git add blog/game-price-comparison.html
          git add blog/best-free-pc-games.html
          git add blog/steam-sale-guide.html
          git add blog/are-90-percent-discounts-good.html

          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git commit -m "Update deals + enriched + umbrella catalog [skip ci]"

          git pull --rebase origin main || {
            git rebase --abort || true
            echo "Rebase conflict on generated files; the refresh was not published"
            exit 1
          }

          git push || {
            echo "Push failed; the refresh was not published"
            exit 1
          }
